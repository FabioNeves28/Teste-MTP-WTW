<h2 class="h4 mb-3">Novo pedido</h2>

<div class="card card-body mb-3">
  <form [formGroup]="form">
    <label class="form-label" for="cliente">Cliente</label>
    <select id="cliente" class="form-select" formControlName="clienteId">
      <option value="" disabled>Selecione o cliente</option>
      @for (cliente of clientes(); track cliente.id) {
        <option [value]="cliente.id">{{ cliente.nome }}</option>
      }
    </select>
    <app-erro-campo [controle]="form.controls.clienteId" />
  </form>
</div>

<div class="card card-body mb-3">
  <form [formGroup]="novoItem" (ngSubmit)="adicionarItem()" class="row g-2 align-items-start">
    <div class="col-md-7">
      <select class="form-select" formControlName="produtoId" aria-label="Produto">
        <option value="" disabled>Selecione o produto</option>
        @for (produto of produtos(); track produto.id) {
          <option [value]="produto.id" [disabled]="produto.quantidadeEstoque === 0">
            {{ produto.nome }} - {{ produto.preco | moeda }} ({{ produto.quantidadeEstoque }} em estoque)
          </option>
        }
      </select>
      <app-erro-campo [controle]="novoItem.controls.produtoId" />
    </div>
    <div class="col-md-2">
      <input type="number" min="1" class="form-control" formControlName="quantidade" aria-label="Quantidade" />
      <app-erro-campo [controle]="novoItem.controls.quantidade" />
    </div>
    <div class="col-md-3">
      <button type="submit" class="btn btn-outline-primary w-100">Adicionar item</button>
    </div>
  </form>

  <table class="table align-middle mt-3 mb-0">
    <thead>
      <tr>
        <th>Produto</th>
        <th class="text-end">Preço</th>
        <th class="text-end">Qtd.</th>
        <th class="text-end">Subtotal</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (item of itens(); track item.produto.id) {
        <tr>
          <td>{{ item.produto.nome }}</td>
          <td class="text-end">{{ item.produto.preco | moeda }}</td>
          <td class="text-end">{{ item.quantidade }}</td>
          <td class="text-end">{{ item.produto.preco * item.quantidade | moeda }}</td>
          <td class="text-end">
            <button type="button" class="btn btn-sm btn-outline-danger" (click)="removerItem(item.produto.id)">
              Remover
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5" class="text-center text-muted">Nenhum item adicionado.</td>
        </tr>
      }
    </tbody>
    <tfoot>
      <tr>
        <th colspan="3" class="text-end">Total</th>
        <th class="text-end">{{ total() | moeda }}</th>
        <th></th>
      </tr>
    </tfoot>
  </table>
</div>

<div class="d-flex gap-2">
  <button type="button" class="btn btn-primary" (click)="salvar()">Criar pedido</button>
  <a class="btn btn-outline-secondary" routerLink="/pedidos">Voltar</a>
</div>
