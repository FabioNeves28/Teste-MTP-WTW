<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="h4 mb-0">Clientes</h2>
  <a class="btn btn-primary" routerLink="novo">Novo cliente</a>
</div>

<table class="table table-hover align-middle">
  <thead>
    <tr>
      <th>Nome</th>
      <th>E-mail</th>
      <th>Documento</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (cliente of clientes(); track cliente.id) {
      <tr>
        <td>{{ cliente.nome }}</td>
        <td>{{ cliente.email }}</td>
        <td>{{ cliente.documento }}</td>
        <td class="text-end">
          <a class="btn btn-sm btn-outline-secondary" [routerLink]="cliente.id">Editar</a>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="4" class="text-center text-muted">Nenhum cliente cadastrado.</td>
      </tr>
    }
  </tbody>
</table>
