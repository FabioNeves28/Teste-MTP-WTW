<h2 class="h4 mb-3">{{ id() ? 'Editar cliente' : 'Novo cliente' }}</h2>

<form [formGroup]="form" (ngSubmit)="salvar()" class="card card-body" style="max-width: 600px">
  <div class="mb-3">
    <label class="form-label" for="nome">Nome</label>
    <input id="nome" class="form-control" formControlName="nome" />
    <app-erro-campo [controle]="form.controls.nome" />
  </div>

  <div class="mb-3">
    <label class="form-label" for="email">E-mail</label>
    <input id="email" type="email" class="form-control" formControlName="email" />
    <app-erro-campo [controle]="form.controls.email" mensagemFormato="Informe um e-mail válido." />
  </div>

  <div class="mb-3">
    <label class="form-label" for="documento">CPF ou CNPJ</label>
    <input id="documento" class="form-control" formControlName="documento" />
    <app-erro-campo [controle]="form.controls.documento" mensagemFormato="Informe um CPF (11 dígitos) ou CNPJ (14 dígitos)." />
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a class="btn btn-outline-secondary" routerLink="/clientes">Voltar</a>
  </div>
</form>
