<h2 class="h4 mb-3">{{ id() ? 'Editar produto' : 'Novo produto' }}</h2>

<form [formGroup]="form" (ngSubmit)="salvar()" class="card card-body" style="max-width: 600px">
  <div class="mb-3">
    <label class="form-label" for="nome">Nome</label>
    <input id="nome" class="form-control" formControlName="nome" />
    <app-erro-campo [controle]="form.controls.nome" />
  </div>

  <div class="mb-3">
    <label class="form-label" for="descricao">Descrição</label>
    <textarea id="descricao" class="form-control" rows="3" formControlName="descricao"></textarea>
    <app-erro-campo [controle]="form.controls.descricao" />
  </div>

  <div class="row">
    <div class="col mb-3">
      <label class="form-label" for="preco">Preço</label>
      <input id="preco" type="number" step="0.01" class="form-control" formControlName="preco" />
      <app-erro-campo [controle]="form.controls.preco" />
    </div>
    <div class="col mb-3">
      <label class="form-label" for="estoque">Quantidade em estoque</label>
      <input id="estoque" type="number" class="form-control" formControlName="quantidadeEstoque" />
      <app-erro-campo [controle]="form.controls.quantidadeEstoque" />
    </div>
  </div>

  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a class="btn btn-outline-secondary" routerLink="/produtos">Voltar</a>
  </div>
</form>
